[project]
name = "gnnepcsaft-mcp-server"
version = "0.5.6"
description = "Model Context Protocol server with GNNPCSAFT tools"
authors = [
    {name = "wildsonbbl", email = "wil_bbl@hotmail.com"}
]
maintainers = [
    {name = "wildsonbbl", email = "wil_bbl@hotmail.com"}
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime (>=1.21.0,<2.0.0)",
    "gnnepcsaft (>=0.3)",
    "mcp (<2.0.0,>1.0.0)",
    "polars",
    "scipy",
]
keywords = [
    "pcsaft", 
    "graph-neural-network", 
    "gnn", 
    "equation-of-state", 
    "chemical-engineering", 
    "thermodynamics", 
    "mcp"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pylint", "pytest"]

[project.urls]
Repository = "https://github.com/wildsonbbl/gnnepcsaft_mcp_server"
Issues = "https://github.com/wildsonbbl/gnnepcsaft_mcp_server/issues"

[project.scripts]
gnnpcsaftmcp = 'gnnepcsaft_mcp_server.mcp_server:run'

[tool.poetry]
include = ["gnnepcsaft_mcp_server/models/assoc_8.onnx", "gnnepcsaft_mcp_server/models/msigmae_7.onnx", "gnnepcsaft_mcp_server/_data"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
